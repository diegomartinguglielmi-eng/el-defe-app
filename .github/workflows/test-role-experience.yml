name: Validar experiencias por rol
on:
  workflow_dispatch:
  push:
    paths:
      - 'web-role-experience.js'
      - 'app/auth.py'
      - 'tests/test_role_experience_contract.py'
      - '.github/workflows/test-role-experience.yml'
permissions:
  contents: read
jobs:
  roles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: node --check web-role-experience.js
      - run: pytest -q tests/test_role_experience_contract.py

