name: Predeploy dry build

on:
  push:
    branches:
      - sponsors-control-predeploy
  workflow_dispatch:

jobs:
  dry-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Netlify build without deploying
        run: bash netlify-build.sh
      - name: Validate sponsor controls
        shell: bash
        run: |
          set -euo pipefail
          grep -R -q 'Mostrar en inicio' netlify-publish/el-defe-app
          grep -R -q 'data-toggle' netlify-publish/el-defe-app
          grep -R -q 'data-delete' netlify-publish/el-defe-app
          grep -R -q '/api/sponsors/featured' netlify-publish/el-defe-app
      - name: Validate store checkout survives build
        shell: bash
        run: |
          set -euo pipefail
          grep -R -q '/api/store/orders/submit' netlify-publish/el-defe-app
          grep -R -q 'DEFE_STORE_NATIVE_EXACT_V4' netlify-publish/el-defe-app
          grep -R -q 'DEFE_STORE_NATIVE_RAILWAY_V1' netlify-publish/el-defe-app
      - name: Validate core overlays survive build
        shell: bash
        run: |
          set -euo pipefail
          ls netlify-publish/el-defe-app/web-acompanan-overlay-*.js >/dev/null
          ls netlify-publish/el-defe-app/web-sponsors-home-sync-*.js >/dev/null
          ls netlify-publish/el-defe-app/store-pickup-hardening-*.js >/dev/null
          ls netlify-publish/el-defe-app/store-order-safety-*.js >/dev/null
          echo 'PREDEPLOY_DRY_BUILD_OK'
