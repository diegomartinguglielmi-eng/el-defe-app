name: Validate LAAMBA promo live
on:
  push:
    branches: [validate-laamba-promo-live]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Inspect production Partidos DOM
        run: |
          node - <<'NODE'
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.goto('https://el-defe-app.netlify.app/el-defe-app/',{waitUntil:'networkidle',timeout:60000});
            await page.getByText('Partidos',{exact:true}).last().click();
            await page.waitForTimeout(1000);
            console.log('allMatches',await page.locator('#allMatches').count());
            console.log('matchExplorer',await page.locator('#matchExplorer').count());
            console.log('defeLoadMatchExplorer',await page.evaluate(()=>typeof window.defeLoadMatchExplorer));
            console.log('ids',await page.locator('[id]').evaluateAll(es=>es.map(e=>e.id).filter(Boolean).slice(0,100)));
            const heads=await page.getByText('PARTIDOS',{exact:true}).evaluateAll(es=>es.map(e=>({tag:e.tagName,cls:e.className,parent:e.parentElement?.outerHTML?.slice(0,2500)})));
            console.log('HEADS',JSON.stringify(heads));
            const p=page.getByText('Partidos',{exact:true}).last();
            console.log('PARTIDOS_NAV',JSON.stringify(await p.evaluate(e=>({tag:e.tagName,cls:e.className,outer:e.outerHTML,parent:e.parentElement?.outerHTML?.slice(0,1800)}))));
            const buttons=await page.locator('button').evaluateAll(es=>es.map(e=>({text:(e.innerText||'').trim(),cls:e.className})).filter(x=>x.text).slice(0,60));
            console.log('BUTTONS',JSON.stringify(buttons));
            if(await page.locator('#allMatches').count()){
              await page.evaluate(()=>window.defeLoadMatchExplorer&&window.defeLoadMatchExplorer());
              await page.waitForTimeout(2000);
              console.log('AFTER_MANUAL_EXPLORER',(await page.locator('body').innerText()).replace(/\s+/g,' ').slice(0,5000));
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE