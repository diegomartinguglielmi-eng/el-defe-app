name: Validate LAAMBA promo live
on:
  push:
    branches: [validate-laamba-promo-live]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect static league payloads
        run: |
          node - <<'NODE'
          const j=require('./defe-datos/datos.json');
          for(const id of ['superliga','lamba']){
            const x=j.ligas.find(y=>y.id===id);
            console.log('LEAGUE_'+id.toUpperCase(),JSON.stringify(x,null,2));
          }
          NODE