name: Build El Defe Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Descargar y validar artefacto web 231
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          rm -rf /tmp/defe-web-artifact /tmp/defe-web-dist /tmp/defe-web-artifact.zip
          mkdir -p /tmp/defe-web-artifact /tmp/defe-web-dist
          gh api repos/${{ github.repository }}/actions/artifacts/10501803696/zip > /tmp/defe-web-artifact.zip
          unzip -q /tmp/defe-web-artifact.zip -d /tmp/defe-web-artifact
          test -f /tmp/defe-web-artifact/defe-web-dist.zip
          unzip -q /tmp/defe-web-artifact/defe-web-dist.zip -d /tmp/defe-web-dist
          test -f /tmp/defe-web-dist/index.html
          FAMILY=$(find /tmp/defe-web-dist -maxdepth 1 -type f -name 'web-family-onboarding*.js' | head -1)
          test -n "$FAMILY"
          grep -R -F 'Mis hijos' /tmp/defe-web-dist >/dev/null
          grep -R -F 'Cerrar sesión' /tmp/defe-web-dist >/dev/null
          grep -F '/api/availability/family/setup' "$FAMILY" >/dev/null
          grep -R -F 'Mi cuenta' /tmp/defe-web-dist >/dev/null
          echo 'ARTEFACTO_231_VALIDADO_OK'

      - name: Empaquetar UI validada en Android
        run: |
          set -euxo pipefail
          rm -rf mobile/www
          mkdir -p mobile/www
          cp -a /tmp/defe-web-dist/. mobile/www/
          grep -R -F 'Mis hijos' mobile/www >/dev/null
          grep -R -F 'Mi cuenta' mobile/www >/dev/null
          grep -R -F '/api/availability/family/setup' mobile/www >/dev/null
          echo 'UI_VALIDADA_ANDROID_OK'

      - name: Instalar dependencias Android
        working-directory: mobile
        run: npm install

      - name: Crear proyecto Android
        working-directory: mobile
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android

      - name: Verificar assets empaquetados
        run: |
          set -euxo pipefail
          test -f mobile/android/app/src/main/assets/public/index.html
          grep -R -F 'Mis hijos' mobile/android/app/src/main/assets/public >/dev/null
          grep -R -F 'Mi cuenta' mobile/android/app/src/main/assets/public >/dev/null
          grep -R -F '/api/availability/family/setup' mobile/android/app/src/main/assets/public >/dev/null
          if grep -R -F 'diegomartinguglielmi-eng.github.io/el-defe-app' mobile/android/app/src/main/assets >/dev/null 2>&1; then
            echo 'ERROR: Android redirige a GitHub Pages'
            exit 1
          fi
          echo 'APK_ASSETS_VALIDATED_OK'

      - name: Build APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Validar APK generado
        run: |
          set -euxo pipefail
          APK=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          rm -rf /tmp/apkcheck
          mkdir /tmp/apkcheck
          unzip -q "$APK" -d /tmp/apkcheck
          test -f /tmp/apkcheck/assets/public/index.html
          grep -R -F 'Mis hijos' /tmp/apkcheck/assets/public >/dev/null
          grep -R -F 'Mi cuenta' /tmp/apkcheck/assets/public >/dev/null
          grep -R -F '/api/availability/family/setup' /tmp/apkcheck/assets/public >/dev/null
          if grep -R -F 'diegomartinguglielmi-eng.github.io/el-defe-app' /tmp/apkcheck/assets >/dev/null 2>&1; then
            echo 'ERROR: APK final redirige a GitHub Pages'
            exit 1
          fi
          echo 'APK_FINAL_VALIDADO_OK'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EL-DEFE-Android-UI-Validada
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
