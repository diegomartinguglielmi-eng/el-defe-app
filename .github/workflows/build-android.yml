name: Build El Defe Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Descargar artefacto web validado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/defe-web-artifact /tmp/defe-web-dist
          mkdir -p /tmp/defe-web-artifact /tmp/defe-web-dist
          gh api repos/${{ github.repository }}/actions/artifacts/10501803696/zip > /tmp/defe-web-artifact.zip
          unzip -q /tmp/defe-web-artifact.zip -d /tmp/defe-web-artifact
          if [ -f /tmp/defe-web-artifact/defe-web-dist.zip ]; then
            unzip -q /tmp/defe-web-artifact/defe-web-dist.zip -d /tmp/defe-web-dist
          else
            cp -a /tmp/defe-web-artifact/. /tmp/defe-web-dist/
          fi
          test -f /tmp/defe-web-dist/index.html
          test -f /tmp/defe-web-dist/web-family-onboarding.js
          grep -R -F 'Mis hijos' /tmp/defe-web-dist >/dev/null
          grep -R -F 'Cerrar sesión' /tmp/defe-web-dist >/dev/null
          grep -F '/api/availability/family/setup' /tmp/defe-web-dist/web-family-onboarding.js >/dev/null
          echo 'ARTEFACTO_WEB_VALIDADO_OK'

      - name: Empaquetar UI validada en Android
        run: |
          rm -rf mobile/www
          mkdir -p mobile/www
          cp -a /tmp/defe-web-dist/. mobile/www/
          grep -R -F 'Mis hijos' mobile/www >/dev/null
          grep -R -F 'Mi cuenta' mobile/www >/dev/null
          if grep -R -F 'EL DEFE' mobile/www/index.html >/dev/null 2>&1 && grep -R -F 'PRÓXIMO PARTIDO' mobile/www/index.html >/dev/null 2>&1; then
            echo 'ERROR: shell Android preliminar detectado'
            exit 1
          fi
          echo 'UI_VALIDADA_ANDROID_OK'

      - name: Instalar dependencias Android
        working-directory: mobile
        run: npm install

      - name: Crear proyecto Android
        working-directory: mobile
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android

      - name: Verificar assets empaquetados
        run: |
          test -f mobile/android/app/src/main/assets/public/index.html
          grep -R -F 'Mis hijos' mobile/android/app/src/main/assets/public >/dev/null
          grep -R -F 'Mi cuenta' mobile/android/app/src/main/assets/public >/dev/null
          grep -F '/api/availability/family/setup' mobile/android/app/src/main/assets/public/web-family-onboarding.js >/dev/null
          if grep -F 'diegomartinguglielmi-eng.github.io/el-defe-app' mobile/android/app/src/main/assets/capacitor.config.json >/dev/null 2>&1; then
            echo 'ERROR: Android redirige a GitHub Pages'
            exit 1
          fi
          echo 'APK_ASSETS_VALIDATED_OK'

      - name: Build APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EL-DEFE-Android-UI-Validada
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
