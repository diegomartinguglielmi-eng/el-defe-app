name: Build El Defe Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Descargar UI institucional validada 220
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          rm -rf /tmp/a220 /tmp/defe-web-dist /tmp/a220.zip
          mkdir -p /tmp/a220 /tmp/defe-web-dist
          gh api repos/${{ github.repository }}/actions/artifacts/10498168381/zip > /tmp/a220.zip
          unzip -q /tmp/a220.zip -d /tmp/a220
          test -f /tmp/a220/defe-web-dist.zip
          unzip -q /tmp/a220/defe-web-dist.zip -d /tmp/defe-web-dist
          test -f /tmp/defe-web-dist/index.html
          grep -R -F 'EL GIGANTE DE TRES DE FEBRERO' /tmp/defe-web-dist >/dev/null
          grep -R -F 'Mi Defe' /tmp/defe-web-dist >/dev/null
          grep -R -F 'Comunidad' /tmp/defe-web-dist >/dev/null
          grep -R -F 'Tienda' /tmp/defe-web-dist >/dev/null
          grep -R -F '/api/availability/admin' /tmp/defe-web-dist >/dev/null
          echo UI_220_INSTITUCIONAL_VALIDADA_OK
      - name: Empaquetar UI 220 en Android
        run: |
          set -euxo pipefail
          rm -rf mobile/www
          mkdir -p mobile/www
          cp -a /tmp/defe-web-dist/. mobile/www/
      - name: Instalar dependencias Android
        working-directory: mobile
        run: npm install
      - name: Crear proyecto Android
        working-directory: mobile
        run: |
          rm -rf android
          npx cap add android
      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android
      - name: Verificar assets empaquetados
        run: |
          set -euxo pipefail
          test -f mobile/android/app/src/main/assets/public/index.html
          grep -R -F 'EL GIGANTE DE TRES DE FEBRERO' mobile/android/app/src/main/assets/public >/dev/null
          grep -R -F 'Mi Defe' mobile/android/app/src/main/assets/public >/dev/null
          grep -R -F '/api/availability/admin' mobile/android/app/src/main/assets/public >/dev/null
          if grep -R -F 'diegomartinguglielmi-eng.github.io/el-defe-app' mobile/android/app/src/main/assets/capacitor.config.json >/dev/null 2>&1; then exit 1; fi
          echo APK_ASSETS_UI_220_OK
      - name: Build APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Validar APK final
        run: |
          set -euxo pipefail
          APK=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          rm -rf /tmp/apkcheck && mkdir /tmp/apkcheck
          unzip -q "$APK" -d /tmp/apkcheck
          grep -R -F 'EL GIGANTE DE TRES DE FEBRERO' /tmp/apkcheck/assets/public >/dev/null
          grep -R -F 'Mi Defe' /tmp/apkcheck/assets/public >/dev/null
          grep -R -F 'Comunidad' /tmp/apkcheck/assets/public >/dev/null
          grep -R -F 'Tienda' /tmp/apkcheck/assets/public >/dev/null
          grep -R -F '/api/availability/admin' /tmp/apkcheck/assets/public >/dev/null
          echo APK_FINAL_UI_220_VALIDADO_OK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EL-DEFE-Android-UI-Institucional-220
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
