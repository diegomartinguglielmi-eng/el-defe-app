name: Sincronizar ligas

on:
  schedule:
    - cron: "0 10,13,16,19,22 * * *"
  workflow_dispatch:
  push:
    paths:
      - "defe-datos/manual.json"
      - "defe-datos/sync-ligas.mjs"
      - "defe-datos/run-sync.mjs"
      - "defe-datos/avisos.mjs"
      - "defe-datos/package.json"

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: defe-datos
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Guardar la sincronización anterior
        run: cp datos.json datos-anterior.json || true

      - name: Leer las ligas
        run: npm run sync

      - name: Avisar lo que cambió
        env:
          AVISOS_URL: ${{ secrets.AVISOS_URL }}
          CLAVE_AVISOS: ${{ secrets.CLAVE_AVISOS }}
        run: node avisos.mjs datos-anterior.json datos.json

      - name: Guardar el resultado en el repo
        run: |
          if [[ -n "$(git status --porcelain datos.json)" ]]; then
            git config user.name "sync-defe"
            git config user.email "sync@defe.local"
            cp datos.json /tmp/datos-sync.json
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/datos-sync.json datos.json
            git add datos.json
            git commit -m "Datos al $(TZ=America/Argentina/Buenos_Aires date +'%d/%m %H:%M')" || exit 0
            git push origin HEAD:main
          else
            echo "Sin cambios."
          fi
