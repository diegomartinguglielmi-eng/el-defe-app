name: UI operativa + Familias

on:
  workflow_dispatch:
  push:
    paths:
      - 'ui-operativa-base/**'
      - 'web-family-onboarding.js'
      - 'web-family-laamba-level.js'
      - 'web-attendance-player-v2.js'
      - '.github/workflows/build-defe-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar base UI durable e integrar mejoras
        run: |
          set -euo pipefail
          rm -rf /tmp/pages
          mkdir -p /tmp/pages
          test -s ui-operativa-base/index.html
          test -s ui-operativa-base/availability-ui-netlify.js
          test -s ui-operativa-base/web-mi-defe-overlay-netlify.js
          cp -a ui-operativa-base/. /tmp/pages/
          cp web-family-onboarding.js /tmp/pages/web-family-onboarding.js
          cp web-family-laamba-level.js /tmp/pages/web-family-laamba-level.js
          cp web-attendance-player-v2.js /tmp/pages/web-attendance-player-v2.js
          rm -f /tmp/pages/web-family-delete.js /tmp/pages/web-attendance-player-filter.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/pages/index.html')
          s=p.read_text()
          s=s.replace('<script src="./web-attendance-player-filter.js"></script>','')
          s=s.replace('<script src="./web-family-delete.js"></script>','')
          for script in ('web-family-onboarding.js','web-family-laamba-level.js','web-attendance-player-v2.js'):
              tag=f'<script src="./{script}"></script>'
              if tag not in s:
                  s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s)
          PY
          node --check /tmp/pages/web-family-onboarding.js
          node --check /tmp/pages/web-family-laamba-level.js
          node --check /tmp/pages/web-attendance-player-v2.js
          grep -F '/api/availability/family/children' /tmp/pages/web-family-onboarding.js >/dev/null
          grep -F '/api/family/catalog' /tmp/pages/web-family-laamba-level.js >/dev/null
          grep -F '/api/availability/v2/me' /tmp/pages/web-attendance-player-v2.js >/dev/null
          grep -F '/api/availability/v2/admin' /tmp/pages/web-attendance-player-v2.js >/dev/null
          grep -F 'data-player-answer' /tmp/pages/web-attendance-player-v2.js >/dev/null
          ! grep -F 'web-family-delete.js' /tmp/pages/index.html
          ! grep -F 'web-attendance-player-filter.js' /tmp/pages/index.html
          echo 'BASE_UI_DURABLE_OK'
      - name: Preparar GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/pages
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar base validada + mejoras
        id: deployment
        uses: actions/deploy-pages@v4
