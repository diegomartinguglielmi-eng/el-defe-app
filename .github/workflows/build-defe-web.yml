name: Compilar y publicar app web

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sincronizar ligas"]
    types: [completed]
  push:
    paths:
      - 'defe-web-listo.zip'
      - 'web-auth-overlay.js'
      - 'web-comms-overlay.js'
      - 'web-comms-push-bridge.js'
      - 'web-push-overlay.js'
      - 'web-acompanan-overlay.js'
      - 'push-sw.js'
      - 'app/static/matches-explorer.js'
      - 'app/static/store-checkout.js'
      - 'patch-*.mjs'
      - 'defe-datos/datos.json'
      - '.github/workflows/build-defe-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar proyecto
        run: |
          rm -rf defe-web-build
          mkdir defe-web-build
          unzip -q defe-web-listo.zip -d defe-web-build

      - name: Instalar dependencias
        working-directory: defe-web-build
        run: npm install

      - name: Compilar para GitHub Pages
        working-directory: defe-web-build
        run: npm run build -- --base=/el-defe-app/

      - name: Aplicar parches
        run: |
          node patch-web-auth.mjs
          node patch-brand.mjs
          node patch-ui-v5.mjs
          node patch-ui-v8.mjs
          node patch-ui-v9.mjs
          node patch-ui-v11.mjs
          node patch-runtime-v19.mjs
          node patch-home-v20.mjs
          node patch-results-v21.mjs
          node patch-fixture-v23.mjs
          node patch-laamba-v24.mjs
          node patch-laamba-v25.mjs
          node patch-argenliga-v26.mjs
          node patch-league-logos-v29.mjs
          node patch-fefi-senior-v30.mjs
          node patch-fefi-senior-v31.mjs
          node patch-fefi-senior-v32.mjs
          node patch-fefi-senior-v33.mjs
          node patch-fefi-senior-v35.mjs
          node patch-store-native.mjs

      - name: Versionar archivos dinámicos
        run: |
          FEFI="fefi-senior-v35-${GITHUB_SHA}.js"
          mv defe-web-build/dist/fefi-senior-v30.js "defe-web-build/dist/${FEFI}"
          sed -i "s#fefi-senior-v30.js#${FEFI}#g" defe-web-build/dist/index.html

      - name: Forzar bundle único
        run: |
          JS=$(basename $(ls defe-web-build/dist/assets/index-*.js | head -1))
          UNIQUE="index-v35-${GITHUB_SHA}.js"
          cp "defe-web-build/dist/assets/${JS}" "defe-web-build/dist/assets/${UNIQUE}"
          sed -i "s#assets/${JS}#assets/${UNIQUE}#" defe-web-build/dist/index.html

      - name: Incorporar datos y overlays de producción
        run: |
          cp defe-datos/datos.json defe-web-build/dist/datos.json
          if [ -f defe-datos/salud.json ]; then cp defe-datos/salud.json defe-web-build/dist/salud.json; fi

          AUTH="web-auth-overlay-${GITHUB_SHA}.js"
          BRIDGE="web-comms-push-bridge-${GITHUB_SHA}.js"
          COMMS="web-comms-overlay-${GITHUB_SHA}.js"
          PUSH="web-push-overlay-${GITHUB_SHA}.js"
          SPONSORS="web-acompanan-overlay-${GITHUB_SHA}.js"
          MATCHES="matches-explorer-${GITHUB_SHA}.js"
          CHECKOUT="store-checkout-${GITHUB_SHA}.js"

          cp web-auth-overlay.js "defe-web-build/dist/${AUTH}"
          cp web-comms-push-bridge.js "defe-web-build/dist/${BRIDGE}"
          cp web-comms-overlay.js "defe-web-build/dist/${COMMS}"
          cp web-push-overlay.js "defe-web-build/dist/${PUSH}"
          cp web-acompanan-overlay.js "defe-web-build/dist/${SPONSORS}"
          cp app/static/matches-explorer.js "defe-web-build/dist/${MATCHES}"
          cp app/static/store-checkout.js "defe-web-build/dist/${CHECKOUT}"
          cp push-sw.js defe-web-build/dist/push-sw.js

          sed -i "s#</body>#<script src=\"./${AUTH}\"></script><script src=\"./${BRIDGE}\"></script><script src=\"./${COMMS}\"></script><script src=\"./${PUSH}\"></script><script src=\"./${MATCHES}\"></script><script src=\"./${CHECKOUT}\"></script><script src=\"./${SPONSORS}\"></script></body>#" defe-web-build/dist/index.html

      - name: Tomar control de service workers antiguos y liberar caches
        run: |
          sed -i 's#<script id="vite-plugin-pwa:register-sw" src="/el-defe-app/registerSW.js"></script>##g' defe-web-build/dist/index.html
          cat > defe-web-build/dist/sw.js <<'EOF'
          self.addEventListener('install', event => { self.skipWaiting(); });
          self.addEventListener('activate', event => {
            event.waitUntil((async()=>{
              try {
                const keys = await caches.keys();
                await Promise.all(keys.map(k => caches.delete(k)));
              } catch (_) {}
              await self.clients.claim();
            })());
          });
          EOF
          echo "// retired" > defe-web-build/dist/registerSW.js
          CLEAN="<script>(async function(){var k='defe-clean-${GITHUB_SHA}';try{if(localStorage.getItem(k))return;localStorage.setItem(k,'1');if('serviceWorker' in navigator){var rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(function(r){return r.update().catch(function(){});}));setTimeout(async function(){try{var rs2=await navigator.serviceWorker.getRegistrations();await Promise.all(rs2.map(function(r){return r.unregister()}));}catch(e){}},1200);}if('caches' in window){var ks=await caches.keys();await Promise.all(ks.map(function(x){return caches.delete(x)}));}}catch(e){}})();</script>"
          sed -i "s#<head>#<head>${CLEAN}#" defe-web-build/dist/index.html

      - name: Verificar build de producción
        run: |
          grep -R "DEFE_UI_V12_20260909" defe-web-build/dist/assets/index-v35-${GITHUB_SHA}.js
          grep -R "DEFE_STORE_NATIVE_RAILWAY_V1" defe-web-build/dist/assets/index-v35-${GITHUB_SHA}.js
          grep -F "api/store/orders" defe-web-build/dist/assets/index-v35-${GITHUB_SHA}.js
          grep -F "fefi-senior-v35-${GITHUB_SHA}.js" defe-web-build/dist/index.html
          grep -F "web-comms-overlay-${GITHUB_SHA}.js" defe-web-build/dist/index.html
          grep -F "web-push-overlay-${GITHUB_SHA}.js" defe-web-build/dist/index.html
          grep -F "web-acompanan-overlay-${GITHUB_SHA}.js" defe-web-build/dist/index.html
          grep -F "matches-explorer-${GITHUB_SHA}.js" defe-web-build/dist/index.html
          grep -F "store-checkout-${GITHUB_SHA}.js" defe-web-build/dist/index.html
          ! grep -F "store-checkout-interceptor" defe-web-build/dist/index.html
          grep -F "Gestionar Sponsors" defe-web-build/dist/web-acompanan-overlay-${GITHUB_SHA}.js
          grep -F "Apertura" defe-web-build/dist/matches-explorer-${GITHUB_SHA}.js
          grep -F "Clausura" defe-web-build/dist/matches-explorer-${GITHUB_SHA}.js
          grep -F "Retiro por la Tienda del Club" defe-web-build/dist/store-checkout-${GITHUB_SHA}.js
          grep -F "push-sw.js" defe-web-build/dist/web-push-overlay-${GITHUB_SHA}.js
          grep -F "addEventListener('push'" defe-web-build/dist/push-sw.js
          grep -F "skipWaiting" defe-web-build/dist/sw.js
          grep -F "clients.claim" defe-web-build/dist/sw.js
          grep -F "getRegistrations" defe-web-build/dist/index.html
          ! grep -F "location.replace" defe-web-build/dist/index.html
          ! grep -F "vite-plugin-pwa:register-sw" defe-web-build/dist/index.html

      - name: Empaquetar dist
        run: |
          cd defe-web-build/dist
          zip -qr ../../defe-web-dist.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: defe-web-dist
          path: defe-web-dist.zip
          retention-days: 7

      - name: Preparar Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: defe-web-build/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
