name: Compilar y publicar app web

on:
  workflow_dispatch:
  push:
    paths:
      - 'defe-web-listo.zip'
      - 'web-auth-overlay.js'
      - 'patch-web-auth.mjs'
      - 'patch-brand.mjs'
      - 'patch-ui-v5.mjs'
      - '.github/workflows/build-defe-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preparar proyecto
        run: |
          rm -rf defe-web-build
          mkdir defe-web-build
          unzip -q defe-web-listo.zip -d defe-web-build
      - name: Instalar dependencias
        working-directory: defe-web-build
        run: npm install
      - name: Compilar para GitHub Pages
        working-directory: defe-web-build
        run: npm run build -- --base=/el-defe-app/
      - name: Reemplazar autenticación nativa por API Railway
        run: node patch-web-auth.mjs
      - name: Aplicar identidad visual del club
        run: node patch-brand.mjs
      - name: Aplicar UI V7 aprobada
        run: node patch-ui-v5.mjs
      - name: Incorporar datos y gestión de usuarios
        run: |
          cp defe-datos/datos.json defe-web-build/dist/datos.json
          if [ -f defe-datos/salud.json ]; then cp defe-datos/salud.json defe-web-build/dist/salud.json; fi
          OVERLAY="web-auth-overlay-${GITHUB_SHA}.js"
          cp web-auth-overlay.js "defe-web-build/dist/${OVERLAY}"
          sed -i "s#</body>#<script src=\"./${OVERLAY}\"></script></body>#" defe-web-build/dist/index.html
      - name: Forzar renovación real de caché PWA
        run: |
          cat > defe-web-build/dist/registerSW.js <<EOF
          if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
              try {
                const reg = await navigator.serviceWorker.register('/el-defe-app/sw.js', { updateViaCache: 'none' });
                await reg.update();
                if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                  if (!sessionStorage.getItem('defe-sw-reloaded-${GITHUB_SHA}')) {
                    sessionStorage.setItem('defe-sw-reloaded-${GITHUB_SHA}', '1');
                    window.location.reload();
                  }
                });
              } catch (e) { console.error('No se pudo actualizar la app', e); }
            });
          }
          EOF
          cat >> defe-web-build/dist/sw.js <<EOF
          // deploy-version: ${GITHUB_SHA}
          self.addEventListener('message', event => {
            if (event.data && event.data.type === 'SKIP_WAITING') self.skipWaiting();
          });
          self.addEventListener('activate', event => {
            event.waitUntil((async () => {
              const keys = await caches.keys();
              await Promise.all(keys.map(key => caches.delete(key)));
              await self.clients.claim();
            })());
          });
          EOF
      - name: Verificar autenticación, UI V7 y actualización PWA
        run: |
          grep -R "el-defe-v5-production.up.railway.app" defe-web-build/dist/assets/index-*.js
          grep -R "Cuenta creada correctamente" defe-web-build/dist/assets/index-*.js
          grep -R "DEFE_UI_V7_20260909" defe-web-build/dist/assets/index-*.js
          grep -R "Podés elegir una, dos o varias" defe-web-build/dist/assets/index-*.js
          grep -R "Categorías de tu familia" defe-web-build/dist/assets/index-*.js
          grep -R "Guardar selección" defe-web-build/dist/assets/index-*.js
          grep -R "Cambiar" defe-web-build/dist/assets/index-*.js
          grep -R "CLUB ATLÉTICO DEFENSORES DE SANTOS LUGARES" defe-web-build/dist/assets/index-*.js
          grep -R "SIEMPRE DEFE!" defe-web-build/dist/assets/index-*.js
          if grep -R 'entrada ${nt(g.entrada)}' defe-web-build/dist/assets/index-*.js; then exit 1; fi
          grep -F "v7-20260909" defe-web-build/dist/index.html
          grep -F "updateViaCache: 'none'" defe-web-build/dist/registerSW.js
          grep -F "deploy-version: ${GITHUB_SHA}" defe-web-build/dist/sw.js
          grep -F "caches.delete" defe-web-build/dist/sw.js
      - name: Empaquetar dist
        run: |
          cd defe-web-build/dist
          zip -qr ../../defe-web-dist.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: defe-web-dist
          path: defe-web-dist.zip
          retention-days: 7
      - name: Preparar Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: defe-web-build/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
