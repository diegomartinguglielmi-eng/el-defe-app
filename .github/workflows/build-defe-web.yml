name: Compilar y publicar app web

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sincronizar ligas"]
    types: [completed]
  push:
    paths:
      - 'defe-web-listo.zip'
      - 'web-auth-overlay.js'
      - 'patch-web-auth.mjs'
      - 'patch-brand.mjs'
      - 'patch-ui-v5.mjs'
      - 'patch-ui-v8.mjs'
      - 'patch-ui-v9.mjs'
      - 'patch-ui-v11.mjs'
      - 'patch-runtime-v19.mjs'
      - 'defe-datos/datos.json'
      - '.github/workflows/build-defe-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preparar proyecto
        run: |
          rm -rf defe-web-build
          mkdir defe-web-build
          unzip -q defe-web-listo.zip -d defe-web-build
      - name: Instalar dependencias
        working-directory: defe-web-build
        run: npm install
      - name: Compilar para GitHub Pages
        working-directory: defe-web-build
        run: npm run build -- --base=/el-defe-app/
      - name: Reemplazar autenticación nativa por API Railway
        run: node patch-web-auth.mjs
      - name: Aplicar identidad visual del club
        run: node patch-brand.mjs
      - name: Aplicar UI base
        run: node patch-ui-v5.mjs
      - name: Aplicar multiselección base
        run: node patch-ui-v8.mjs
      - name: Aplicar V10 multiselección visible
        run: node patch-ui-v9.mjs
      - name: Aplicar V12 cierre real del selector
        run: node patch-ui-v11.mjs
      - name: Verificar V12 estable
        run: |
          grep -R "DEFE_UI_V12_20260909" defe-web-build/dist/assets/index-*.js
          grep -R "EXPLICIT_CATEGORY_EDITOR_STATE" defe-web-build/dist/assets/index-*.js
          grep -R 'children:"Próxima fecha"' defe-web-build/dist/assets/index-*.js
          grep -R 'children:"Futsal"' defe-web-build/dist/assets/index-*.js
          grep -R 'children:"Novedades"' defe-web-build/dist/assets/index-*.js
      - name: Corregir crash FEFI V19
        run: node patch-runtime-v19.mjs
      - name: Forzar bundle único V19
        run: |
          JS=$(basename $(ls defe-web-build/dist/assets/index-*.js | head -1))
          UNIQUE="index-v19-${GITHUB_SHA}.js"
          cp "defe-web-build/dist/assets/${JS}" "defe-web-build/dist/assets/${UNIQUE}"
          sed -i "s#assets/${JS}#assets/${UNIQUE}#" defe-web-build/dist/index.html
          echo "Bundle publicado: ${UNIQUE}"
      - name: Incorporar datos y gestión de usuarios
        run: |
          cp defe-datos/datos.json defe-web-build/dist/datos.json
          if [ -f defe-datos/salud.json ]; then cp defe-datos/salud.json defe-web-build/dist/salud.json; fi
          OVERLAY="web-auth-overlay-${GITHUB_SHA}.js"
          cp web-auth-overlay.js "defe-web-build/dist/${OVERLAY}"
          sed -i "s#</body>#<script src=\"./${OVERLAY}\"></script></body>#" defe-web-build/dist/index.html
      - name: Limpiar PWA una sola vez
        run: |
          cat > defe-web-build/dist/registerSW.js <<EOF
          if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
              const key = 'defe-recovery-${GITHUB_SHA}';
              if (sessionStorage.getItem(key)) return;
              sessionStorage.setItem(key, '1');
              try {
                const regs = await navigator.serviceWorker.getRegistrations();
                for (const r of regs) await r.unregister();
                const keys = await caches.keys();
                await Promise.all(keys.map(k => caches.delete(k)));
                window.location.replace('/el-defe-app/?v=${GITHUB_SHA}');
              } catch (e) { console.error('No se pudo limpiar caché PWA', e); }
            }, { once: true });
          }
          EOF
          cat > defe-web-build/dist/sw.js <<EOF
          // V19 recovery service worker intentionally inert
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', event => event.waitUntil(self.registration.unregister()));
          EOF
      - name: Verificar V19 y datos FEFI
        run: |
          grep -R "el-defe-v5-production.up.railway.app" defe-web-build/dist/assets/index-v19-${GITHUB_SHA}.js
          grep -R "DEFE_UI_V12_20260909" defe-web-build/dist/assets/index-v19-${GITHUB_SHA}.js
          grep -R "DEFE_RUNTIME_V19_OPTIONAL_FEFI_PTS" defe-web-build/dist/assets/index-v19-${GITHUB_SHA}.js
          grep -R 'Array.isArray(c.pts)' defe-web-build/dist/assets/index-v19-${GITHUB_SHA}.js
          ! grep -R 'c.pts\[0\]' defe-web-build/dist/assets/index-v19-${GITHUB_SHA}.js | grep -v 'Array.isArray(c.pts)'
          grep -R 'children:"Próxima fecha"' defe-web-build/dist/assets/index-v19-${GITHUB_SHA}.js
          grep -R 'children:"Futsal"' defe-web-build/dist/assets/index-v19-${GITHUB_SHA}.js
          grep -R 'children:"Novedades"' defe-web-build/dist/assets/index-v19-${GITHUB_SHA}.js
          grep -F "assets/index-v19-${GITHUB_SHA}.js" defe-web-build/dist/index.html
          grep -F "v19-runtime-20260909" defe-web-build/dist/index.html
          grep -R '"rival": "CNEL. BRANDSEN"' defe-web-build/dist/datos.json
          grep -A8 '"rival": "CNEL. BRANDSEN"' defe-web-build/dist/datos.json | grep -A3 '"2013"' | grep '4'
      - name: Empaquetar dist
        run: |
          cd defe-web-build/dist
          zip -qr ../../defe-web-dist.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: defe-web-dist
          path: defe-web-dist.zip
          retention-days: 7
      - name: Preparar Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: defe-web-build/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
