name: Compilar y publicar app web

on:
  workflow_dispatch:
  push:
    paths:
      - 'defe-web-listo.zip'
      - '.github/workflows/build-defe-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar proyecto
        run: |
          rm -rf defe-web-build
          mkdir defe-web-build
          unzip -q defe-web-listo.zip -d defe-web-build

      - name: Instalar dependencias
        working-directory: defe-web-build
        run: npm install

      - name: Compilar
        working-directory: defe-web-build
        run: npm run build

      - name: Incorporar datos sincronizados
        run: |
          cp defe-datos/datos.json defe-web-build/dist/datos.json
          if [ -f defe-datos/salud.json ]; then cp defe-datos/salud.json defe-web-build/dist/salud.json; fi

      - name: Empaquetar dist
        run: |
          cd defe-web-build/dist
          zip -qr ../../defe-web-dist.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: defe-web-dist
          path: defe-web-dist.zip
          retention-days: 7

      - name: Preparar Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: defe-web-build/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
