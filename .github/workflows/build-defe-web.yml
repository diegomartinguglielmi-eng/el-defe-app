name: Compilar y publicar app web

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sincronizar ligas"]
    types: [completed]
  push:
    paths:
      - 'defe-web-listo.zip'
      - 'web-auth-overlay.js'
      - 'patch-*.mjs'
      - 'defe-datos/datos.json'
      - '.github/workflows/build-defe-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preparar proyecto
        run: |
          rm -rf defe-web-build
          mkdir defe-web-build
          unzip -q defe-web-listo.zip -d defe-web-build
      - name: Instalar dependencias
        working-directory: defe-web-build
        run: npm install
      - name: Compilar para GitHub Pages
        working-directory: defe-web-build
        run: npm run build -- --base=/el-defe-app/
      - name: Aplicar parches
        run: |
          node patch-web-auth.mjs
          node patch-brand.mjs
          node patch-ui-v5.mjs
          node patch-ui-v8.mjs
          node patch-ui-v9.mjs
          node patch-ui-v11.mjs
          node patch-runtime-v19.mjs
          node patch-home-v20.mjs
          node patch-results-v21.mjs
          node patch-fixture-v23.mjs
          node patch-laamba-v24.mjs
          node patch-laamba-v25.mjs
          node patch-argenliga-v26.mjs
          node patch-league-logos-v29.mjs
          node patch-fefi-senior-v30.mjs
          node patch-fefi-senior-v31.mjs
          node patch-fefi-senior-v32.mjs
          node patch-fefi-senior-v33.mjs
      - name: Forzar bundle único
        run: |
          JS=$(basename $(ls defe-web-build/dist/assets/index-*.js | head -1))
          UNIQUE="index-v33-${GITHUB_SHA}.js"
          cp "defe-web-build/dist/assets/${JS}" "defe-web-build/dist/assets/${UNIQUE}"
          sed -i "s#assets/${JS}#assets/${UNIQUE}#" defe-web-build/dist/index.html
      - name: Incorporar datos y gestión de usuarios
        run: |
          cp defe-datos/datos.json defe-web-build/dist/datos.json
          if [ -f defe-datos/salud.json ]; then cp defe-datos/salud.json defe-web-build/dist/salud.json; fi
          OVERLAY="web-auth-overlay-${GITHUB_SHA}.js"
          cp web-auth-overlay.js "defe-web-build/dist/${OVERLAY}"
          sed -i "s#</body>#<script src=\"./${OVERLAY}\"></script></body>#" defe-web-build/dist/index.html
      - name: Limpiar PWA
        run: |
          sed -i "s#<head>#<head><script>(function(){var v='${GITHUB_SHA}';if(!location.search.includes('v='+v)){location.replace('/el-defe-app/?v='+v);}})();</script>#" defe-web-build/dist/index.html
          echo "// inert" > defe-web-build/dist/sw.js
      - name: Verificar V33
        run: |
          grep -R "DEFE_UI_V12_20260909" defe-web-build/dist/assets/index-v33-${GITHUB_SHA}.js
          grep -F "league-logos-v29.js" defe-web-build/dist/index.html
          grep -F "fefi-senior-v30.js" defe-web-build/dist/index.html
          grep -F "resultadosApertura" defe-web-build/dist/fefi-senior-v30.js
          grep -F "posicionesClausura" defe-web-build/dist/fefi-senior-v30.js
          grep -F ">PJ<" defe-web-build/dist/fefi-senior-v30.js
          grep -F ">Pts<" defe-web-build/dist/fefi-senior-v30.js
      - name: Empaquetar dist
        run: |
          cd defe-web-build/dist
          zip -qr ../../defe-web-dist.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: defe-web-dist
          path: defe-web-dist.zip
          retention-days: 7
      - name: Preparar Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: defe-web-build/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
