name: Restaurar UI operativa 10:21

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-defe-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefacto exacto del build operativo 10:21
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10498124937/zip" \
            -o /tmp/operativo.zip
          rm -rf /tmp/outer /tmp/recovered /tmp/pages
          mkdir -p /tmp/outer /tmp/recovered /tmp/pages
          unzip -q /tmp/operativo.zip -d /tmp/outer
          if [ -f /tmp/outer/netlify-publish.zip ]; then
            unzip -q /tmp/outer/netlify-publish.zip -d /tmp/recovered
          else
            cp -a /tmp/outer/. /tmp/recovered/
          fi
      - name: Preparar raíz correcta para GitHub Pages
        run: |
          set -euo pipefail
          test -s /tmp/recovered/el-defe-app/index.html
          cp -a /tmp/recovered/el-defe-app/. /tmp/pages/
          test -s /tmp/pages/index.html
          test -s /tmp/pages/web-mi-defe-overlay-netlify.js
          test -s /tmp/pages/availability-ui-netlify.js
          test -s /tmp/pages/web-auth-overlay-netlify.js
          test -s /tmp/pages/escudo-dsl.svg
          grep -F 'Mi Defe' /tmp/pages/web-mi-defe-overlay-netlify.js >/dev/null
          grep -F '/api/availability/admin' /tmp/pages/availability-ui-netlify.js >/dev/null
          echo 'RAIZ_PAGES_CORRECTA_Y_UI_1021_VALIDADA'
      - name: Preparar GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar UI 10:21 en raíz del proyecto Pages
        id: deployment
        uses: actions/deploy-pages@v4
