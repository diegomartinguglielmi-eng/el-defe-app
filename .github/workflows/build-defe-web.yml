name: UI operativa + Familias

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'web-family-onboarding.js'
      - 'web-family-laamba-level.js'
      - 'web-family-account-fix.js'
      - 'web-defe-core.js'
      - 'web-attendance-player-v2.js'
      - 'web-home-family.js'
      - '.github/workflows/build-defe-web.yml'
  push:
    paths:
      - 'web-family-onboarding.js'
      - 'web-family-laamba-level.js'
      - 'web-family-account-fix.js'
      - 'web-defe-core.js'
      - 'web-attendance-player-v2.js'
      - 'web-home-family.js'
      - '.github/workflows/build-defe-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar base operativa versionada
        run: |
          set -euo pipefail
          rm -rf /tmp/recovered /tmp/pages
          mkdir -p /tmp/recovered/el-defe-app /tmp/pages
          cp -a ui-operativa-base/. /tmp/recovered/el-defe-app/
      - name: Restaurar tablero operativo e integrar Familias
        run: |
          set -euo pipefail
          test -s /tmp/recovered/el-defe-app/index.html
          cp -a /tmp/recovered/el-defe-app/. /tmp/pages/
          cp web-family-onboarding.js /tmp/pages/web-family-onboarding.js
          cp web-family-laamba-level.js /tmp/pages/web-family-laamba-level.js
          cp web-family-account-fix.js /tmp/pages/web-family-account-fix.js
          cp web-defe-core.js /tmp/pages/web-defe-core.js
          cp web-attendance-player-v2.js /tmp/pages/web-attendance-player-v2.js
          cp web-home-family.js /tmp/pages/web-home-family.js
          rm -f /tmp/pages/web-family-delete.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/pages/index.html')
          s=p.read_text()
          s=s.replace('<script src="./web-attendance-player-filter.js"></script>','')
          s=s.replace('<script src="./web-family-delete.js"></script>','')
          scripts=['web-defe-core.js','web-family-onboarding.js','web-family-account-fix.js','web-family-laamba-level.js','web-attendance-player-v2.js','web-home-family.js']
          for name in scripts:
              tag=f'<script src="./{name}"></script>'
              if tag not in s:s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s)
          PY
          test -s /tmp/pages/availability-ui-netlify.js
          test -s /tmp/pages/web-mi-defe-overlay-netlify.js
          node --check /tmp/pages/web-family-onboarding.js
          node --check /tmp/pages/web-family-laamba-level.js
          node --check /tmp/pages/web-family-account-fix.js
          node --check /tmp/pages/web-defe-core.js
          node --check /tmp/pages/web-attendance-player-v2.js
          node --check /tmp/pages/web-home-family.js
          grep -F '/api/availability/family/children' /tmp/pages/web-family-onboarding.js >/dev/null
          grep -F '/api/family/catalog' /tmp/pages/web-family-laamba-level.js >/dev/null
          grep -F 'data-laamba-category' /tmp/pages/web-family-laamba-level.js >/dev/null
          if grep -F 'web-family-delete.js' /tmp/pages/index.html; then echo 'ERROR: overlay duplicado de familias sigue cargado'; exit 1; fi
          if grep -F 'web-attendance-player-filter.js' /tmp/pages/index.html; then echo 'ERROR: filtro experimental sigue cargado'; exit 1; fi
          grep -F 'web-family-onboarding.js' /tmp/pages/index.html >/dev/null
          grep -F 'web-family-account-fix.js' /tmp/pages/index.html >/dev/null
          grep -F 'web-auth-overlay-netlify.js' /tmp/pages/index.html >/dev/null
          grep -F 'deploy-preview-' /tmp/pages/index.html >/dev/null
          grep -F 'el-defe-v2-staging-production.up.railway.app' /tmp/pages/index.html >/dev/null
          echo 'TABLERO_ASISTENCIA_ORIGINAL_Y_FAMILIAS_LAAMBA_3_NIVELES'
      - name: Preparar GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/pages
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar base validada + Familias
        id: deployment
        uses: actions/deploy-pages@v4
