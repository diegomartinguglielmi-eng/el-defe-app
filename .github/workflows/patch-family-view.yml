name: Fix Family multiliga state
on:
  push:
    branches: [mi-defe-v2-laamba]
    paths: ['.github/workflows/patch-family-view.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mi-defe-v2-laamba
      - name: Unify family multiliga state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('defe-v2/src/main.jsx')
          s=p.read_text()
          # Persist the selected participation per child instead of falling back to legacy FEFI state.
          old="const[kid,setKid]=useState(0),[adding,setAdding]=useState(false)"
          new="const[kid,setKid]=useState(0),[adding,setAdding]=useState(false)"
          assert old in s
          # Replace activity initialization with persisted, child-specific selection.
          olda="[activity,setActivity]=useState(0),[multiEvents,setMultiEvents]=useState([])"
          newa="[activity,setActivity]=useState(()=>Number(localStorage.getItem('defe_family_activity')||0)),[multiEvents,setMultiEvents]=useState([])"
          assert olda in s
          s=s.replace(olda,newa,1)
          # Do not blindly reset to FEFI whenever player data hydrates/re-renders.
          oldr="useEffect(()=>setActivity(0),[active?.id]);"
          newr="useEffect(()=>{const saved=Number(localStorage.getItem('defe_family_activity_'+(active?.id||''))||0);setActivity(Number.isFinite(saved)?saved:0)},[active?.id]);"
          assert oldr in s
          s=s.replace(oldr,newr,1)
          # Persist explicit participation changes.
          oldclick="onClick={()=>setActivity(i)}"
          newclick="onClick={()=>{setActivity(i);localStorage.setItem('defe_family_activity_'+(active?.id||''),String(i))}}"
          assert oldclick in s
          s=s.replace(oldclick,newclick)
          # Guard an index that becomes invalid while teams hydrate.
          oldteam="const activeTeam=activeTeams[activity]||activeTeams[0];"
          newteam="const activeTeam=activeTeams[activity]||activeTeams[0];useEffect(()=>{if(activity>=activeTeams.length&&activeTeams.length)setActivity(0)},[active?.id,activeTeams.length,activity]);"
          assert oldteam in s
          s=s.replace(oldteam,newteam,1)
          p.write_text(s)
          PY
      - name: Verify build
        run: |
          cd defe-v2
          npm install
          npm run build
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add defe-v2/src/main.jsx
          git commit -m 'fix: keep one multiliga family state across initial load and refresh' || exit 0
          git push origin HEAD:mi-defe-v2-laamba
