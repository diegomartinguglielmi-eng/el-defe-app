name: Remove legacy callup card from Family Inicio
on:
  push:
    branches: [mi-defe-v2-laamba]
    paths: ['.github/workflows/patch-family-view.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mi-defe-v2-laamba
      - name: Make Inicio structurally independent from legacy callup UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('defe-v2/src/main.jsx')
          s=p.read_text(); before=s
          # Keep callup only as status data for the blue canonical card.
          # Remove any standalone legacy callup card rendered before canonical Inicio.
          import re
          family_start=s.index('function FamilyHome')
          canonical=s.index("{familyTab==='inicio'&&(()=>", family_start)
          prefix=s[family_start:canonical]
          patterns=[
            r"\{familyTab==='inicio'&&activeCallup&&<section[\s\S]*?</section>\}",
            r"\{familyTab==='inicio'&&activeCallup&&<div[\s\S]*?</div>\}",
            r"\{activeCallup&&familyTab==='inicio'&&<section[\s\S]*?</section>\}",
            r"\{activeCallup&&familyTab==='inicio'&&<div[\s\S]*?</div>\}",
          ]
          removed=0
          for pat in patterns:
            prefix,n=re.subn(pat,'',prefix,count=1); removed+=n
          # The screenshot text is a stronger guard: if a pre-canonical block contains
          # the legacy attendance actions, remove its surrounding section.
          if 'Confirmo' in prefix or 'Asistencia confirmada' in prefix:
            last=prefix.rfind('<section')
            if last!=-1:
              close=prefix.find('</section>',last)
              if close!=-1:
                block=prefix[last:close+10]
                if 'Confirmo' in block or 'Asistencia confirmada' in block or 'No asiste' in block:
                  prefix=prefix[:last]+prefix[close+10:]; removed+=1
          s=s[:family_start]+prefix+s[canonical:]
          if s==before: raise SystemExit('Legacy pre-canonical callup block not found; refusing fake success')
          p.write_text(s)
          print('removed legacy blocks:',removed)
          PY
      - name: Verify exact Family Inicio contract and build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('defe-v2/src/main.jsx').read_text(); a=s.index('function FamilyHome'); c=s.index("{familyTab==='inicio'&&(()=>",a); pre=s[a:c]
          assert 'Asistencia confirmada' not in pre
          assert '>Confirmo<' not in pre
          assert '>No asiste<' not in pre
          body=s[c:s.index("{showStandings&&",c)]
          assert 'canonicalNextMatch' in body and 'canonicalTraining' in body and 'canonicalCommunications' in body
          assert "activeCallup.attendance" in body
          print('PASS: Inicio has no standalone legacy attendance card; status remains inside canonical blue card')
          PY
          cd defe-v2
          npm install
          npm run build
      - name: Commit real app change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add defe-v2/src/main.jsx
          git diff --cached --quiet && { echo 'No app change'; exit 1; }
          git commit -m 'fix: remove standalone legacy attendance card from Family Inicio'
          git push origin HEAD:mi-defe-v2-laamba
