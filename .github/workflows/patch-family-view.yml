name: Fix Argenliga Family Inicio legacy card
on:
  push:
    branches: [mi-defe-v2-laamba]
    paths: ['.github/workflows/patch-family-view.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mi-defe-v2-laamba
      - name: Remove legacy Argenliga callup card from Inicio and normalize event
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('defe-v2/src/main.jsx')
          s=p.read_text()
          before=s
          # ARGENLIGA event objects expose opponent/match_date/home_away; normalize them
          # to the same fields consumed by the canonical blue hero.
          old="const event=multiEvents.find(x=>String(x.selection||'').toUpperCase()===(competition+'|'+category).toUpperCase());const nextMatch=competition==='FEFI'?visibleFefiMatch:event;"
          new="const rawEvent=multiEvents.find(x=>String(x.selection||'').toUpperCase()===(competition+'|'+category).toUpperCase());const event=rawEvent?{...rawEvent,home:rawEvent.home||(rawEvent.home_away==='local'?'DEF. DE SANTOS LUGARES':rawEvent.opponent),away:rawEvent.away||(rawEvent.home_away==='local'?rawEvent.opponent:'DEF. DE SANTOS LUGARES'),date:rawEvent.date||rawEvent.match_date,time:rawEvent.time||rawEvent.match_time,local:rawEvent.local??rawEvent.home_away==='local'}:null;const nextMatch=competition==='FEFI'?visibleFefiMatch:event;"
          if old not in s: raise SystemExit('canonical event expression not found')
          s=s.replace(old,new,1)
          # Critical: activeCallup must match selected league/category. Previously an
          # Argenliga selection could inherit a FEFI/legacy callup and render the old state.
          old2="const activeCallup=familyView.activeCallup;const visibleFefiMatch=familyView.visibleMatch;"
          new2="const rawActiveCallup=familyView.activeCallup;const activeCallup=(rawActiveCallup&&String(rawActiveCallup.competition||'FEFI').toUpperCase()===String(activeTeam?.competition||'FEFI').toUpperCase()&&String(rawActiveCallup.category||'')===String(activeTeam?.category||active?.category||''))?rawActiveCallup:null;const visibleFefiMatch=familyView.visibleMatch;"
          if old2 not in s: raise SystemExit('activeCallup expression not found')
          s=s.replace(old2,new2,1)
          if s==before: raise SystemExit('no source change')
          p.write_text(s)
          PY
      - name: Verify and build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('defe-v2/src/main.jsx').read_text()
          assert 'rawActiveCallup' in s
          assert 'rawEvent' in s and 'rawEvent.match_date' in s
          print('Argenliga canonical Inicio normalization verified')
          PY
          cd defe-v2
          npm install
          npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add defe-v2/src/main.jsx
          git diff --cached --quiet && { echo 'No app change'; exit 1; }
          git commit -m 'fix: normalize Argenliga Family Inicio to canonical card'
          git push origin HEAD:mi-defe-v2-laamba
