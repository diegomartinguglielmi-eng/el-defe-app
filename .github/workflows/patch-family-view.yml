name: Unify Family Inicio layout
on:
  push:
    branches: [mi-defe-v2-laamba]
    paths: ['.github/workflows/patch-family-view.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mi-defe-v2-laamba
      - name: Put common greeting and notification pill first
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('defe-v2/src/main.jsx')
          s=p.read_text()
          welcome='<div className="familyWelcome"><div><h1>Hola, {family?.full_name?.split(\' \')[0]||\'Familia\'} 👋</h1><p>Todo lo importante de {active?.nickname||active?.full_name?.split(\' \')[0]||\'tu familia\'}.</p></div><NotifyButton token={localStorage.getItem(\'defe_token\')}/></div>'
          assert s.count(welcome)==1, f'welcome occurrences: {s.count(welcome)}'
          s=s.replace(welcome,'',1)
          anchor='<article>{active&&familyTab!==\'familia\'&&'
          assert anchor in s, 'article anchor not found'
          s=s.replace(anchor,'<article>{familyTab===\'inicio\'&&'+welcome+'}{active&&familyTab!==\'familia\'&&',1)
          p.write_text(s)
          PY
      - name: Verify build
        run: |
          cd defe-v2
          npm install
          npm run build
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add defe-v2/src/main.jsx
          git commit -m 'fix: use one Family Inicio layout for every league' || exit 0
          git push origin HEAD:mi-defe-v2-laamba
