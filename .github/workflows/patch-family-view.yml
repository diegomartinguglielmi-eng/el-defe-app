name: Patch FamilyHome multiliga
on:
  push:
    branches: [mi-defe-v2-laamba]
    paths: ['.github/workflows/patch-family-view.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mi-defe-v2-laamba
      - name: Patch main.jsx
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('defe-v2/src/main.jsx')
          s=p.read_text()
          old="import{loadNextMatch,answerCallup}from'./familyApi';"
          new=old+"import{buildFamilyView}from'./familyView';"
          assert old in s and "from'./familyView'" not in s
          s=s.replace(old,new,1)
          start=s.index('function FamilyHome(')
          end=s.index('function CoachCommunications(',start)
          pre,fam,post=s[:start],s[start:end],s[end:]
          old2="const activeCallup=callups.find(x=>x.person_id===active?.id&&String(x.competition||'').toUpperCase()===String(activeTeam?.competition||'').toUpperCase()&&String(x.category||'').toUpperCase()===String(activeTeam?.category||'').toUpperCase());const activeFefiEvent=multiEvents.find(x=>x.selection===\"FEFI|\"+activeTeam?.category&&x.available);const visibleFefiMatch=fefiFamilyMatch||activeFefiEvent;"
          new2="const familyView=buildFamilyView({players,kid,activity,events:multiEvents,callups,fefiMatch:fefiFamilyMatch});const activeCallup=familyView.activeCallup;const visibleFefiMatch=familyView.visibleMatch;"
          assert old2 in fam
          fam=fam.replace(old2,new2,1)
          old3='<small>BABY FÚTBOL · FEFI</small>'
          assert old3 in fam
          fam=fam.replace(old3,'<small>{familyView.header}</small>',1)
          p.write_text(pre+fam+post)
          PY
      - name: Verify build
        run: |
          cd defe-v2
          npm ci
          npm run build
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add defe-v2/src/main.jsx
          git commit -m 'fix: unify FamilyHome participation source' || exit 0
          git push origin HEAD:mi-defe-v2-laamba
