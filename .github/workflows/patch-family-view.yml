name: Rebuild canonical Family Inicio
on:
  push:
    branches: [mi-defe-v2-laamba]
    paths: ['.github/workflows/patch-family-view.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mi-defe-v2-laamba
      - name: Rebuild Inicio as one canonical five-block screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('defe-v2/src/main.jsx')
          s=p.read_text()
          # Locate the current FamilyHome return and its Inicio section, then normalize
          # the existing blocks by semantic text so league-specific extras cannot precede them.
          # We intentionally keep the existing data/actions and change composition only.
          s=s.replace("<article className={familyTab==='inicio'?'familyUnifiedInicio':''}>","<article className={familyTab==='inicio'?'familyCanonicalInicio':''}>")
          # Tag the existing welcome/select/hero/training/comms blocks using current class names/text hooks.
          replacements={
            'className="familyWelcome"':'className="familyWelcome canonicalGreeting"',
            'className="familySelector"':'className="familySelector canonicalViewing"',
            'className="familyPlayerSelector"':'className="familyPlayerSelector canonicalViewing"',
            'className="familyHero"':'className="familyHero canonicalNextMatch"',
            'className="nextMatchCard"':'className="nextMatchCard canonicalNextMatch"',
            'className="familyTraining"':'className="familyTraining canonicalTraining"',
            'className="trainingCard"':'className="trainingCard canonicalTraining"',
            'className="familyCommunications"':'className="familyCommunications canonicalCommunications"',
            'className="communicationsCard"':'className="communicationsCard canonicalCommunications"'
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          p.write_text(s)
          css=Path('defe-v2/src/style.css'); c=css.read_text()
          c += '''\n/* Canonical Inicio: identical composition for FEFI, ARGENLIGA and LAAMBA. League only changes data. */\n.familyCanonicalInicio{display:flex!important;flex-direction:column!important;gap:16px!important}\n.familyCanonicalInicio .canonicalGreeting{order:1!important}\n.familyCanonicalInicio .canonicalViewing{order:2!important}\n.familyCanonicalInicio .canonicalNextMatch{order:3!important}\n.familyCanonicalInicio .canonicalTraining{order:4!important}\n.familyCanonicalInicio .canonicalCommunications{order:5!important}\n.familyCanonicalInicio .familyComplementary,.familyCanonicalInicio .laambaResultCard,.familyCanonicalInicio .laambaStandingsCard,.familyCanonicalInicio .familyInicioCallup,.familyCanonicalInicio .availabilityCard{display:none!important}\n.familyCanonicalInicio .canonicalNextMatch{background:linear-gradient(135deg,#1657b8,#2871d8)!important;color:#fff!important;border:0!important;border-radius:24px!important;box-shadow:0 14px 30px rgba(24,84,170,.18)!important}\n.familyCanonicalInicio .canonicalNextMatch h1,.familyCanonicalInicio .canonicalNextMatch h2,.familyCanonicalInicio .canonicalNextMatch h3,.familyCanonicalInicio .canonicalNextMatch strong,.familyCanonicalInicio .canonicalNextMatch p,.familyCanonicalInicio .canonicalNextMatch small{color:inherit}\n'''
          css.write_text(c)
          PY
      - name: Verify build
        run: |
          cd defe-v2
          npm install
          npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add defe-v2/src/main.jsx defe-v2/src/style.css
          git diff --cached --quiet && { echo 'No app change'; exit 1; }
          git commit -m 'refactor: canonical five-block Family Inicio'
          git push origin HEAD:mi-defe-v2-laamba
