name: Rebuild canonical Family Inicio JSX
on:
  push:
    branches: [mi-defe-v2-laamba]
    paths: ['.github/workflows/patch-family-view.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mi-defe-v2-laamba
      - name: Replace Inicio JSX with one league-agnostic render
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('defe-v2/src/main.jsx')
          s=p.read_text()
          start="{familyTab==='inicio'&&<>"
          end="{showStandings&&"
          a=s.index(start)
          b=s.index(end,a)
          new=r'''{familyTab==='inicio'&&(()=>{const competition=String(activeTeam?.competition||'FEFI').toUpperCase();const category=activeTeam?.category||active?.category||'';const event=multiEvents.find(x=>String(x.selection||'').toUpperCase()===(competition+'|'+category).toUpperCase());const nextMatch=competition==='FEFI'?visibleFefiMatch:event;const comms=communications.filter(x=>(x.category==='Todos'||String(x.category)===String(category))&&!deletedMessages.includes(x.id));return <><section className="familyNext familyNextCompact canonicalNextMatch"><div className="sectionTitleRow"><small>PRÓXIMO PARTIDO · {competition}</small>{activeCallup&&<b className={'homeAttendance '+(activeCallup.attendance||'pending')}>{activeCallup.attendance==='yes'?'✓ CONFIRMADO':activeCallup.attendance==='no'?'✕ NO ASISTE':'CONVOCADO'}</b>}</div>{nextMatch?<><h3>{nextMatch.home} vs. {nextMatch.away}</h3><p><b>{nextMatch.date?new Date(String(nextMatch.date).slice(0,10)+'T12:00:00').toLocaleDateString('es-AR',{weekday:'short',day:'2-digit',month:'2-digit'}):'Fecha a confirmar'}</b> · {nextMatch.match_time||nextMatch.time||'Horario a confirmar'} hs · {(nextMatch.home_away==='local'||nextMatch.local===true)?'Local':'Visitante'}</p><button className="homeMatchAction" onClick={()=>setFamilyTab('partidos')}>Ver partido ›</button></>:<><h3>Próxima fecha a confirmar</h3><p className="muted">Todavía no encontramos una próxima fecha publicada para {competition} · {category}.</p><button className="homeMatchAction" onClick={()=>setFamilyTab('partidos')}>Ver partido ›</button></>}</section><section className="familyAbsence canonicalTraining"><div className="sectionTitleRow"><div><small>ENTRENAMIENTOS</small><h3>Avisar una ausencia</h3></div><button className="textAction" onClick={()=>{setAbsenceOpen(!absenceOpen);setAbsenceMsg('')}}>{absenceOpen?'Cerrar':'Avisar ›'}</button></div><p className="muted">Informale al profe si no va a poder entrenar.</p>{absenceOpen&&<div className="absenceForm"><div className="absenceReasons">{[['sick','🤒','Está enfermo'],['study','📚','Tiene que estudiar'],['vacation','🏖️','Estamos de vacaciones'],['other','💬','Otro']].map(([id,icon,label])=><button key={id} className={absenceReason===id?'selected':''} onClick={()=>setAbsenceReason(id)}><span>{icon}</span><b>{label}</b></button>)}</div>{absenceReason==='other'&&<><textarea maxLength="120" rows="3" placeholder="Contale brevemente al profe..." value={absenceNote} onChange={e=>setAbsenceNote(e.target.value)}/><small className="absenceCounter">{absenceNote.length}/120</small></>}{absenceMsg&&<p className={absenceMsg.startsWith('✓')?'successMsg':'formError'}>{absenceMsg}</p>}<button className="primary wide" disabled={absenceBusy||!absenceReason||(absenceReason==='other'&&!absenceNote.trim())} onClick={async()=>{setAbsenceBusy(true);setAbsenceMsg('');try{const rr=await fetch('/api/notifications/absence',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+familyToken},body:JSON.stringify({person_id:active.id,competition,category,reason:absenceReason,note:absenceReason==='other'?absenceNote.trim():null})}),dd=await rr.json();if(!rr.ok)throw new Error(dd.detail||'No pudimos enviar el aviso.');setAbsenceMsg('✓ Ausencia informada al profesor');setAbsenceReason('');setAbsenceNote('')}catch(e){setAbsenceMsg(e.message)}finally{setAbsenceBusy(false)}}}>{absenceBusy?'Enviando…':'Avisar al profe'}</button></div>}</section><section className="familyMessagePreview canonicalCommunications"><div className="sectionTitleRow"><div><small>COMUNICACIONES RECIENTES</small><h3>{comms.filter(x=>!x.read).length?comms.filter(x=>!x.read).length+' sin leer':'Todo al día'}</h3></div><button className="textAction" onClick={()=>setFamilyTab('mensajes')}>Ver mensajes ›</button></div>{comms[0]&&<p><b>{comms[0].title}</b><br/><span className="muted">{comms[0].body}</span></p>}</section></>})()}'''
          s=s[:a]+new+s[b:]
          # Make the player/league selector the canonical second block.
          s=s.replace('className="playerContext"','className="playerContext canonicalViewing"',1)
          p.write_text(s)
          PY
      - name: Verify exact structure and build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('defe-v2/src/main.jsx').read_text()
          assert "ÚLTIMO RESULTADO · LAAMBA" not in s[s.index("function FamilyHome"):s.index("function CoachCommunications")]
          assert "TABLA · LAAMBA" not in s[s.index("function FamilyHome"):s.index("function CoachCommunications")]
          assert "competition,category,reason" in s
          assert "canonicalNextMatch" in s and "canonicalTraining" in s and "canonicalCommunications" in s
          print('Canonical Family Inicio JSX verified')
          PY
          cd defe-v2
          npm install
          npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add defe-v2/src/main.jsx
          git diff --cached --quiet && { echo 'No app change'; exit 1; }
          git commit -m 'refactor: replace Family Inicio with canonical multileague JSX'
          git push origin HEAD:mi-defe-v2-laamba
