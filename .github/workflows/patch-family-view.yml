name: Recover validated multileague professor build
on:
  push:
    branches: [mi-defe-v2-laamba]
    paths: ['.github/workflows/patch-family-view.yml']
permissions:
  contents: write
jobs:
  recover-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mi-defe-v2-laamba
          fetch-depth: 0
      - name: Restore validated professor implementation
        run: git checkout a78aac38f64ecac0699ce1ac967edb5df773c376 -- defe-v2/src/main.jsx
      - name: Validate multileague implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('defe-v2/src/main.jsx').read_text()
          required=["selections:(td.selections||[])","f.selections","BABY · FEFI","FUTSAL · ARGENLIGA","FUTSAL · LAAMBA","body:JSON.stringify({selections:next})","x.replace('|',' · ')"]
          for x in required: assert x in s, x
          forbidden=["selections:f.categories.map(x=>'FEFI|'+x)","selections:next.map(y=>'FEFI|'+y)"]
          for x in forbidden: assert x not in s, x
          print('Validated multileague professor implementation restored')
          PY
      - name: Build V2
        working-directory: defe-v2
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit restored validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add defe-v2/src/main.jsx
          git diff --cached --check
          git commit -m "fix: restore validated multileague professor source"
          git push origin HEAD:mi-defe-v2-laamba
