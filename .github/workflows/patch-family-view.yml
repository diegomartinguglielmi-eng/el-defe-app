name: Inspect admin professor form safely
on:
  push:
    branches: [mi-defe-v2-laamba]
    paths: ['.github/workflows/patch-family-view.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mi-defe-v2-laamba
      - name: Inspect exact professor implementation without changing app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('defe-v2/src/main.jsx').read_text()
          terms=['Profesores registrados','PROFESORES REGISTRADOS','Nuevo profesor','NUEVO PROFESOR','Crear profesor','Editar planteles','professor','profesor']
          hits=[]
          for term in terms:
            pos=0
            while True:
              i=s.lower().find(term.lower(),pos)
              if i<0: break
              hits.append((i,term)); pos=i+1
          hits=sorted(set(hits))
          print('TOTAL HITS',len(hits))
          for n,(i,term) in enumerate(hits[:30],1):
            a=max(0,i-1800); b=min(len(s),i+4200)
            print(f'\n===== HIT {n}: {term} @ {i} =====')
            print(s[a:b])
          print('\n===== STATE CANDIDATES =====')
          for m in re.finditer(r'useState\([^\n]{0,500}',s):
            x=m.group(0)
            if any(k in x.lower() for k in ['prof','category','categor']): print(x[:1000])
          if not hits: raise SystemExit('No professor implementation found')
          PY
