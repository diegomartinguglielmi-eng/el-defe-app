name: Fix Family initial hydration
on:
  push:
    branches: [mi-defe-v2-laamba]
    paths: ['.github/workflows/patch-family-view.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mi-defe-v2-laamba
      - name: Refresh complete family data on first mount
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('defe-v2/src/main.jsx')
          s=p.read_text()
          needle="function FamilyHome({family,players=[],refresh}){const pushParams="
          replacement="function FamilyHome({family,players=[],refresh}){useEffect(()=>{if(typeof refresh==='function')refresh()},[]);const pushParams="
          assert needle in s, 'FamilyHome signature not found'
          s=s.replace(needle,replacement,1)
          p.write_text(s)
          PY
      - name: Verify build
        run: |
          cd defe-v2
          npm install
          npm run build
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add defe-v2/src/main.jsx
          git commit -m 'fix: hydrate complete multiliga family data on login' || exit 0
          git push origin HEAD:mi-defe-v2-laamba
