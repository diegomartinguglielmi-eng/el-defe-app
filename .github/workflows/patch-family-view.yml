name: Patch FamilyHome multiliga
on:
  push:
    branches: [mi-defe-v2-laamba]
    paths: ['.github/workflows/patch-family-view.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mi-defe-v2-laamba
      - name: Standardize family home card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('defe-v2/src/main.jsx')
          s=p.read_text()
          old='active&&activeTeam?.competition==="FEFI"&&<><section className="familyNext familyNextCompact"><div className="sectionTitleRow"><small>PRÓXIMO PARTIDO · FEFI</small>'
          new='active&&activeTeam&&<><section className="familyNext familyNextCompact"><div className="sectionTitleRow"><small>PRÓXIMO PARTIDO · {activeTeam.competition}</small>'
          assert old in s, 'FEFI home card not found'
          s=s.replace(old,new,1)
          old_la='activeTeam?.competition==="LAAMBA"&&(()=>{'
          assert old_la in s, 'LAAMBA special card not found'
          s=s.replace(old_la,'false&&(()=>{',1)
          p.write_text(s)
          PY
      - name: Verify build
        run: |
          cd defe-v2
          npm install
          npm run build
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add defe-v2/src/main.jsx
          git commit -m 'fix: use shared family home card for every competition' || exit 0
          git push origin HEAD:mi-defe-v2-laamba
