name: Standardize Family screens across leagues
on:
  push:
    branches: [mi-defe-v2-laamba]
    paths: ['.github/workflows/patch-family-view.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mi-defe-v2-laamba
      - name: Normalize Family Inicio using current JSX
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('defe-v2/src/main.jsx')
          s=p.read_text()
          before=s
          # Current app has league-specific blocks. Instead of guessing old class names,
          # normalize their order at render time with CSS order on stable content markers.
          # Add semantic wrapper classes to the known LAAMBA complementary blocks.
          s=s.replace('className="laambaResultCard"','className="laambaResultCard familyComplementary"')
          s=s.replace('className="laambaStandingsCard"','className="laambaStandingsCard familyComplementary"')
          # ARGENLIGA/other callup card is not a primary Inicio block; keep attendance in Partidos.
          # Hide any callup/availability card that is rendered inside Inicio via a scoped marker class.
          s=s.replace('className="familyCallupCard"','className="familyCallupCard familyInicioCallup"')
          s=s.replace('className="availabilityCard"','className="availabilityCard familyInicioCallup"')
          # Make the article explicitly use a common family layout hook.
          s=s.replace('<article>{familyTab===\'inicio\'&&<div className="familyWelcome"','<article className={familyTab===\'inicio\'?\'familyUnifiedInicio\':\'\'}>{familyTab===\'inicio\'&&<div className="familyWelcome"',1)
          if s==before:
              raise SystemExit('No current JSX markers changed; aborting instead of fake success')
          p.write_text(s)
          css=Path('defe-v2/src/style.css')
          c=css.read_text()
          rules='''\n/* Unified Family UI: league/category changes data, never screen composition */\n.familyUnifiedInicio{display:flex;flex-direction:column}\n.familyUnifiedInicio .familyWelcome{order:1}\n.familyUnifiedInicio .familyPlayerSelector,.familyUnifiedInicio .familyKidSelector,.familyUnifiedInicio .familyActivitySelector{order:2}\n.familyUnifiedInicio .familyHero,.familyUnifiedInicio .nextMatchCard{order:3}\n.familyUnifiedInicio .familyTraining,.familyUnifiedInicio .trainingCard{order:4}\n.familyUnifiedInicio .familyCommunications{order:5}\n.familyUnifiedInicio .familyComplementary{order:6}\n.familyUnifiedInicio .familyInicioCallup{display:none!important}\n'''
          if 'Unified Family UI: league/category changes data' not in c:
              css.write_text(c+rules)
          PY
      - name: Verify real source change and build
        run: |
          git diff --exit-code -- defe-v2/src/main.jsx defe-v2/src/style.css && { echo 'ERROR: no app source changed'; exit 1; } || true
          cd defe-v2
          npm install
          npm run build
      - name: Commit real app change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add defe-v2/src/main.jsx defe-v2/src/style.css
          git diff --cached --quiet && { echo 'ERROR: nothing to commit'; exit 1; }
          git commit -m 'refactor: one Family UI across all leagues'
          git push origin HEAD:mi-defe-v2-laamba
