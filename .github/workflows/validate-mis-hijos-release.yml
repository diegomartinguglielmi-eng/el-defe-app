name: Validar release Mis hijos

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/availability_player_v2.py'
      - 'app/family_context_v1.py'
      - 'app/main_checkout.py'
      - 'web-defe-core.js'
      - 'web-family-onboarding.js'
      - 'web-family-account-fix.js'
      - 'web-family-laamba-level.js'
      - 'web-attendance-player-v2.js'
      - 'web-home-family.js'
      - 'ui-operativa-base/**'
      - '.github/workflows/validate-mis-hijos-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar Python
        run: |
          python -m py_compile app/availability_player_v2.py app/family_context_v1.py app/main_checkout.py
      - name: Validar JavaScript
        run: |
          node --check web-defe-core.js
          node --check web-family-onboarding.js
          node --check web-family-account-fix.js
          node --check web-family-laamba-level.js
          node --check web-attendance-player-v2.js
          node --check web-home-family.js
      - name: Validar integración backend
        run: |
          grep -F 'availability_player_v2_router' app/main_checkout.py
          grep -F 'family_context_router' app/main_checkout.py
          grep -F 'include_router(availability_player_v2_router)' app/main_checkout.py
          grep -F 'include_router(family_context_router)' app/main_checkout.py
      - name: Validar integración frontend
        run: |
          grep -F 'DefeCore' web-family-onboarding.js
          grep -F '/api/availability/family/children' web-family-onboarding.js
          grep -F '/api/family/catalog' web-family-laamba-level.js
          grep -F '/api/availability/v2/me' web-attendance-player-v2.js

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar navegador E2E
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Validar Preview real en navegador
        env:
          PREVIEW_URL: https://deploy-preview-16--el-defe-app.netlify.app
          STAGING_API: https://el-defe-v2-staging-production.up.railway.app
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const assert = (v,m)=>{if(!v) throw new Error(m)};
          (async()=>{
            const stamp=Date.now();
            const email=`e2e-${stamp}@mail.com`, password='Qa-' + stamp + '-A9!';
            let r=await fetch(process.env.STAGING_API+'/api/auth/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,password,full_name:'Familia E2E'})});
            assert(r.ok,'registro staging '+r.status);
            r=await fetch(process.env.STAGING_API+'/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,password})});
            assert(r.ok,'login staging '+r.status);
            const d=await r.json(); const token=d.access_token||d.token;
            assert(token,'token staging ausente');
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.goto(process.env.PREVIEW_URL,{waitUntil:'domcontentloaded'});
            await page.evaluate(t=>{localStorage.setItem('defe_access_token',t)},token);
            await page.reload({waitUntil:'networkidle'});
            await page.getByText('Mi cuenta',{exact:true}).first().click();
            const hijos=page.getByText('Mis hijos',{exact:true});
            await hijos.waitFor({state:'visible',timeout:20000});
            await hijos.click();
            await page.getByText(/Mis hijos|Completá los datos de tus hijos/).first().waitFor({state:'visible',timeout:10000});
            console.log('BROWSER_E2E_OK');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
