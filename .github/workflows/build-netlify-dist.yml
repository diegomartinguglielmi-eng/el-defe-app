name: Build Netlify dist temporal

on:
  push:
    paths:
      - '.github/workflows/build-netlify-dist.yml'
      - 'web-fefi-dedupe.js'
      - 'web-ui-hotfix.js'
      - 'netlify-build.sh'
      - 'netlify.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Construir salida Netlify
        run: bash netlify-build.sh
      - name: Empaquetar salida
        run: |
          cd netlify-publish
          zip -qr ../netlify-publish.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: netlify-publish
          path: netlify-publish.zip
          retention-days: 1
