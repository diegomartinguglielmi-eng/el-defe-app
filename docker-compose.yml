services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: el_defe
      POSTGRES_USER: defe
      POSTGRES_PASSWORD: defe
    volumes:
      - defe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defe -d el_defe"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  defe_pgdata:
